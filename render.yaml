# Render Blueprint: Dockerised Phoenix release + managed Postgres.
#
# Usage: Render Dashboard → New → Blueprint → pick this repository.
# The first sync asks for the secrets marked `sync: false` below.
# Generate them first: bash scripts/init-env.sh (or openssl rand -hex 64).
services:
  - type: web
    name: robinahs-shop
    runtime: docker
    plan: free
    # Service and database must share a region: the private-network hostname in
    # DATABASE_URL only resolves inside the region that hosts the instance.
    # The region is fixed at creation time, so change both entries together.
    region: oregon
    healthCheckPath: /healthz
    envVars:
      # Phoenix endpoint host, cookie domain and LiveView origin checks.
      # Render injects the service's onrender.com hostname.
      - key: PHX_HOST
        fromService:
          name: robinahs-shop
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: PORT
        value: "10000"
      # `connectionString` is the database's complete internal URL
      # (postgresql://user:password@host:5432/database) on Render's private
      # network — same region as the service above, no TLS needed.
      # An external URL works too: sslmode=require is honoured automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: robinahs-shop-db
          property: connectionString
      - key: POOL_SIZE
        value: "5"
      - key: ERL_FLAGS
        value: "+S 2:2"
      # openssl rand -hex 64 — must be 64+ bytes, so it is entered by hand.
      # If SECRET_BASE_KEY is set instead, it wins over SECRET_KEY_BASE.
      - key: SECRET_KEY_BASE
        sync: false
      # Generated once by Render and kept across syncs; the release refuses to
      # boot without them (staff session digests and the LiveView salt).
      - key: JWT_SECRET
        generateValue: true
      - key: LIVE_SIGNING_SALT
        generateValue: true
      # Owner bootstrap account for a new database; an existing owner is never
      # overwritten, and both values are validated before the account is created.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: robinahs-shop-db
    # Must match the web service region above (private DNS is per region).
    region: oregon
    databaseName: robinah_shop
    user: robinah
    plan: free

# Render Blueprint: Dockerised Phoenix release + external PostgreSQL.
#
# Usage: Render Dashboard → New → Blueprint → pick this repository.
# The first sync asks for the secrets marked `sync: false` below.
# Generate them first: bash scripts/init-env.sh (or openssl rand -hex 64).
services:
  - type: web
    name: robinahs-shop
    runtime: docker
    plan: free
    # Fixed at creation time. The database is no longer a Render instance, so
    # only the web service lives here; change it together with any proxy/DNS.
    region: oregon
    healthCheckPath: /healthz
    envVars:
      # PHX_HOST is deliberately NOT set. The release resolves the public
      # hostname from RENDER_EXTERNAL_HOSTNAME when PHX_HOST is absent, and
      # that value is always correct. Delete any PHX_HOST left in the
      # dashboard: "true", "false" or a full https:// URL make the release
      # refuse to boot because every LiveView websocket would fail with 403.
      #
      # The release only starts the HTTP endpoint when PHX_SERVER is true.
      # The Docker image already sets it; it is repeated here so the service
      # does not depend on the image's ENV.
      - key: PHX_SERVER
        value: "true"
      - key: PORT
        value: "10000"
      # Complete URL of the external PostgreSQL server. `sync: false` keeps the
      # password out of git, but Render only prompts for it when the service is
      # first created: on an existing service, setting or changing it is a
      # manual step in Environment (Dashboard → service → Environment).
      # Format:
      #   postgresql://user:password@host:5432/database?sslmode=require
      # `sslmode=require` (or `verify-ca`/`verify-full`) is required for a
      # server reached over the public internet; a Render internal URL
      # (`postgresql://…@…render.internal:5432/…`, no sslmode) only resolves
      # when the database is a Render instance in this same region.
      - key: DATABASE_URL
        sync: false
      - key: POOL_SIZE
        value: "5"
      - key: ERL_FLAGS
        value: "+S 2:2"
      # openssl rand -hex 64 — must be 64+ bytes, so it is entered by hand.
      # The release prefers SECRET_BASE_KEY when both names exist: remove any
      # stale SECRET_BASE_KEY from the dashboard, otherwise its value is used
      # instead and a short one makes the release refuse to boot.
      - key: SECRET_KEY_BASE
        sync: false
      # Generated once by Render and kept across syncs; the release refuses to
      # boot without them (staff session digests and the LiveView salt).
      - key: JWT_SECRET
        generateValue: true
      - key: LIVE_SIGNING_SALT
        generateValue: true
      # Owner bootstrap account for a new database; an existing owner is never
      # overwritten, and both values are validated before the account is created.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

# No `databases:` block: DATABASE_URL points at the external PostgreSQL
# service above, so the web service and the database no longer have to share a
# Render region. Removing a database from a blueprint makes Render offer to
# delete the old instance on the next sync — confirm only when it is empty.
